name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install tarball in isolation
        run: |
          mkdir /tmp/smoke
          cd /tmp/smoke
          npm init -y
          npm install $GITHUB_WORKSPACE/kosoukhov-cht-cli-*.tgz
      - name: Verify CLI binary executes
        run: |
          cd /tmp/smoke
          npx cht --help
